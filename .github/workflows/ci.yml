name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: Client typecheck + tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Client tests use node:test with built-in TypeScript (Node 22.7+).
          node-version: '22'
          cache: 'npm'
          # Client is an npm workspace; lockfile lives at the repo root.
          cache-dependency-path: package-lock.json
      - name: Install (root workspace)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
        working-directory: client
      - name: Unit tests
        run: npm test
        working-directory: client
      - name: Build
        run: npx vite build
        working-directory: client

  server:
    name: Server typecheck + tests + boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: Typecheck
        run: npm run typecheck
        working-directory: server
      - name: Tests
        run: npm test
        working-directory: server
      - name: Boot smoke test
        # The server once shipped unable to start; prove it boots and answers.
        working-directory: server
        env:
          PORT: '8000'
          MUSICLUV_DATA_DIR: ${{ runner.temp }}/musicluv-data
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health > /dev/null; then
              echo "server is up"; exit 0
            fi
            sleep 1
          done
          echo "server did not come up"; cat server.log; exit 1

  audio-engine:
    name: Audio engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -e '.[test]'
        working-directory: audio-engine
      - name: Run pytest
        # Includes the edge-case suite and the teacher-labelled real-audio
        # gate (skips until recordings exist — docs/recording-guide.md).
        run: pytest -q
        working-directory: audio-engine
