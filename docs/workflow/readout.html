<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow readout</title>
<style>
  :root {
    --ink: #1f2a37; --muted: #5b6878; --line: #c9d1da; --page: #ffffff; --lane: #f4f6f8;
    --band: #3b4652; --phase: #4f7a8a; --badge: #3f6f80;
    --actor: #dfe9ee; --actor-b: #8aa7b4;
    --svc: #ffffff; --svc-b: #2b3540;
    --llm: #fbefc7; --llm-b: #d4b25a;
    --emb: #fbf3db; --emb-b: #d9c38a;
    --api: #cfe1e8; --api-b: #6e98a8;
    --plat: #e3e6e9; --plat-b: #8d969f;
    --opt: #eef0f2; --opt-b: #9aa3ab;
    --gap-b: #c0392b;
    --guard: #e3f2e6; --guard-b: #5e9e6e;
    --eval: #ece6f6; --eval-b: #8a76b8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 13px/1.45 -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
  .wrap { padding: 28px 32px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 14px; max-width: 1100px; }
  .meta { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0 0 22px; font-size: 12.5px; }
  .meta dt { font-weight: 600; } .meta dd { margin: 0; color: var(--muted); }

  /* ── Diagram ─────────────────────────────────────────────── */
  #diagram { display: inline-block; padding: 18px; background: var(--page); }
  .grid { display: grid; gap: 6px; }
  .uc { background: var(--band); color: #fff; font-weight: 700; font-size: 12px; padding: 7px 10px; border-radius: 3px; }
  .ph { background: var(--phase); color: #fff; font-weight: 600; font-size: 11.5px; padding: 6px 10px; border-radius: 2px; }
  .lanehead { background: var(--lane); padding: 12px 10px; border-left: 4px solid var(--phase); }
  .lanehead b { display: block; font-size: 12.5px; }
  .lanehead span { display: block; color: var(--muted); font-size: 10.5px; margin-top: 3px; }
  .cell { background: var(--lane); padding: 8px 7px; display: flex; flex-direction: column; gap: 8px; border-left: 1px solid #dfe4e9; }
  .gapcol { background: repeating-linear-gradient(135deg, #f1f3f5 0 6px, #e6e9ec 6px 12px); border: 1px dashed #b9c1c9; display: flex; align-items: center; justify-content: center; }
  .gapcol span { writing-mode: vertical-rl; transform: rotate(180deg); color: var(--muted); font-size: 11px; font-weight: 600; text-align: center; padding: 8px 0; }
  .box { position: relative; border: 1.4px solid; border-radius: 4px; padding: 7px 8px 8px; font-size: 10.6px; line-height: 1.38; }
  .box .tag { font-size: 9px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 2px; }
  .box .t { font-weight: 700; font-size: 11.4px; margin-bottom: 3px; padding-right: 20px; }
  .box .b { color: #33404d; overflow-wrap: anywhere; }
  .box code { font-size: 10px; background: rgba(255,255,255,.55); padding: 0 2px; border-radius: 2px; }
  .badge { position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; border-radius: 50%; background: var(--badge); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .k-actor { background: var(--actor); border-color: var(--actor-b); }
  .k-service { background: var(--svc); border-color: var(--svc-b); }
  .k-llm { background: var(--llm); border-color: var(--llm-b); }
  .k-embedding { background: var(--emb); border-color: var(--emb-b); border-style: dashed; }
  .k-api { background: var(--api); border-color: var(--api-b); }
  .k-platform { background: var(--plat); border-color: var(--plat-b); }
  .k-optional { background: var(--opt); border-color: var(--opt-b); border-style: dashed; }
  .k-notintegrated { background: #fff; border-color: var(--gap-b); border-style: dashed; }
  .k-notintegrated .tag { color: var(--gap-b); }
  .k-guardrail { background: var(--guard); border-color: var(--guard-b); }
  .k-eval { background: var(--eval); border-color: var(--eval-b); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-top: 14px; font-size: 11px; color: var(--muted); }
  .legend i { display: inline-block; width: 22px; height: 13px; border: 1.4px solid; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }
  .legend .n { width: 16px; height: 16px; border-radius: 50%; background: var(--badge); border: 0; }
  .foot { display: flex; justify-content: space-between; gap: 20px; margin-top: 8px; font-size: 10.5px; color: var(--muted); }

  /* ── Readout text ─────────────────────────────────────────── */
  .text { max-width: 1180px; margin-top: 34px; }
  .text h2 { font-size: 17px; margin: 30px 0 6px; padding-top: 12px; border-top: 1px solid var(--line); }
  .text h3 { font-size: 13.5px; margin: 18px 0 6px; color: var(--phase); }
  .text p.intro { color: var(--muted); margin: 0 0 10px; }
  ol.steps { list-style: none; padding: 0; margin: 0; }
  ol.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; margin: 0 0 7px; }
  ol.steps li .num { width: 20px; height: 20px; border-radius: 50%; background: var(--badge); color: #fff; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; margin: 6px 0 4px; }
  th, td { text-align: left; vertical-align: top; padding: 6px 9px; border-bottom: 1px solid var(--line); }
  th { background: var(--lane); font-weight: 600; }
  td code, li code { font-size: 11.5px; background: #f2f4f6; padding: 0 3px; border-radius: 3px; }
  ul.bul { margin: 4px 0 0 18px; padding: 0; } ul.bul li { margin: 0 0 4px; }
  body.diagram-only .text, body.diagram-only .head { display: none; }
  body.diagram-only .wrap { padding: 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1 id="title"></h1><p class="sub" id="subtitle"></p><dl class="meta" id="meta"></dl></div>
  <div id="diagram"></div>
  <div class="text" id="text"></div>
</div>

entity · optional engines"},{"id":"guard","title":"Guardrails and evals","subtitle":"what protects · what measures"}],"boxes":[{"phase":"p1","lane":"ui","kind":"actor","badge":1,"tag":"Learner · Web app","title":"Opens MusicLuv","body":"Welcome → mic check (echo cancel / noise suppress / auto-gain **off**) → picks one of **8** instruments"},{"phase":"p1","lane":"svc","kind":"service","badge":2,"tag":"Client code","title":"Boot and restore","body":"Restores user, progress, current instrument + lesson from browser storage · `GET /api/v1/monetization/status` (launch promo)"},{"phase":"p1","lane":"api","kind":"api","badge":3,"tag":"Supabase Auth · optional","title":"Sign in","body":"`POST /auth/v1/token`, `/signup`, `/otp`, `/authorize` (Google/Apple) · dev stub when `VITE_SUPABASE_URL` unset"},{"phase":"p1","lane":"data","kind":"platform","tag":"Browser","title":"localStorage","body":"User, progress, XP, plan, launch status, current lesson · per device, no cloud sync"},{"phase":"p1","lane":"guard","kind":"guardrail","tag":"Guardrail","title":"Scope flags","body":"`VITE_FEATURES` hides community, creator, proctored, live lessons, compositions, teacher, 14 generated instruments"},{"phase":"p2","lane":"ui","kind":"actor","badge":4,"tag":"Learner · Lesson runner","title":"Concept → Teach → Demo → Dissect","body":"First 4 of the 9 lesson phases: goal, written lesson, demo clips at 50 / 75 / 100 %, control close-ups"},{"phase":"p2","lane":"svc","kind":"service","badge":5,"tag":"Client + server code","title":"Catalogs and demo audio","body":"Lessons + **745** exercises bundled from `shared/catalogs` · `GET /api/v1/reference-audio/:lessonId[/:refId]`"},{"phase":"p2","lane":"api","kind":"api","badge":6,"tag":"Audio engine","title":"Render reference","body":"`POST /render` → deterministic synthesized WAV, cached 1 year"},{"phase":"p2","lane":"data","kind":"notintegrated","tag":"Not integrated","title":"Recorded reference audio","body":"Educator-recorded demos (vision §7). Today every demo is synthesized sine harmonics"},{"phase":"p2","lane":"guard","kind":"eval","tag":"Eval · planned","title":"Content quality gate","body":"No automated lesson lint or educator review yet; 406 lessons are generator scaffolding"},{"phase":"p3","lane":"ui","kind":"actor","badge":7,"tag":"Learner · On-screen instrument","title":"Virtual try and guided play","body":"Taps piano / guitar / violin / drums / sitar; piano range follows the lesson (e.g. C3–G4)"},{"phase":"p3","lane":"svc","kind":"service","badge":8,"tag":"Client code","title":"Count hits","body":"Exact note, or same note name if the instrument can't play it · drums: any distinct pads · Tone.js playback"},{"phase":"p3","lane":"api","kind":"api","badge":9,"tag":"Public CDN","title":"Instrument samples","body":"`GET nbrosowsky.github.io/tonejs-instruments/…` (piano, guitar, violin) · Google Fonts"},{"phase":"p3","lane":"data","kind":"notintegrated","tag":"Planned","title":"Self-hosted samples","body":"Licensed, cached for offline (roadmap Phase 2)"},{"phase":"p3","lane":"guard","kind":"guardrail","tag":"Guardrail","title":"Touch safety","body":"Pointer events + `touch-none`: one tap = one note; hit counted before samples load"},{"phase":"p4","lane":"ui","kind":"actor","badge":10,"tag":"Learner · Practice studio","title":"Records a take","body":"Mic live meter → **one-bar count-in** → plays → Done / auto-stop · optional *Offline mode*"},{"phase":"p4","lane":"svc","kind":"service","badge":11,"tag":"Client code","title":"Capture","body":"Keeps audio only from 150 ms before the downbeat → WAV 22.05 kHz (device rate fallback) · live pitch meter on the same audio clock"},{"phase":"p4","lane":"data","kind":"platform","tag":"Browser","title":"IndexedDB offline queue","body":"`musicluv/offlineAttempts`: WAV + grading request, status pending → graded"},{"phase":"p4","lane":"guard","kind":"guardrail","tag":"Guardrail","title":"Only the take is graded","body":"Warm-up notes and waiting are discarded; live meter is display-only"},{"phase":"p5","lane":"ui","kind":"actor","tag":"Learner","title":"Sees grader status","body":"● grader live · ⚠ grader offline (takes saved) · ○ demo mode (simulated)"},{"phase":"p5","lane":"svc","kind":"service","badge":12,"tag":"Client code","title":"Send for grading","body":"`POST {VITE_AUDIO_ENGINE_URL}/grade` multipart: WAV + target (scaled to take tempo) + rubric + `mode` notes/onsets · 30 s timeout"},{"phase":"p5","lane":"ai","kind":"optional","badge":14,"tag":"Optional model · off by default","title":"CREPE pitch model","body":"`PITCH_BACKEND=crepe` (TensorFlow). Default is pYIN — classic signal processing, **no AI model**. No LLM in grading"},{"phase":"p5","lane":"api","kind":"api","badge":13,"tag":"Audio engine · FastAPI","title":"Grade","body":"pYIN pitch (band from targets) → split notes at re-attacks → align, fit start offset + tempo → score **pitch (cents) · rhythm · consistency**"},{"phase":"p5","lane":"data","kind":"notintegrated","tag":"Not integrated","title":"Server grade history","body":"Client calls the engine directly; `POST /api/v1/grade` proxy that records attempts is unused"},{"phase":"p5","lane":"guard","kind":"guardrail","tag":"Guardrail","title":"Engine limits","body":"20 MB / 180 s (413) · WAV/FLAC/OGG only (415) · unknown note 422 · tone & dynamics **not graded**"},{"phase":"p5","lane":"guard","kind":"eval","tag":"Eval · CI","title":"Grading tests + real-audio gate","body":"74 engine tests incl. edge cases · teacher-agreement ≥ 90 % gate, **skips until recordings exist**"},{"phase":"p6","lane":"ui","kind":"actor","badge":15,"tag":"Learner · Feedback","title":"Result, overlay, drill, quiz","body":"Score + issues (wrong note, cents, early/late, missed, tempo) · take vs target overlay · micro-drill · mastery quiz"},{"phase":"p6","lane":"svc","kind":"service","badge":16,"tag":"Client code","title":"Apply the grade","body":"Lesson `passCriteria` on top of rubric pass → XP, hearts, lessons completed. Simulated grades: **no** progress"},{"phase":"p6","lane":"data","kind":"platform","tag":"Browser","title":"localStorage progress","body":"Per device; lost if storage is cleared"},{"phase":"p6","lane":"guard","kind":"eval","tag":"Eval · partial","title":"Mastery quiz","body":"217 exams in catalog · MCQ + listening live · notation, tap-rhythm, free-text, practical are **placeholders**"},{"phase":"p7","lane":"ui","kind":"actor","badge":17,"tag":"Learner · Mentor chat","title":"Asks the mentor","body":"Question + lesson id + last score summary · canned lines when no server"},{"phase":"p7","lane":"svc","kind":"service","badge":18,"tag":"Node server · Express","title":"Mentor proxy","body":"`POST /api/v1/mentor/message` · signed-in user · persona + lesson from server catalogs · ≤ 2,000 chars · canned fallback"},{"phase":"p7","lane":"ai","kind":"llm","badge":19,"tag":"LLM call","title":"Claude — mentor reply","body":"`claude-sonnet-4-6` default (`LLM_MODEL`) · 300 tokens · 15 s timeout · alt `gpt-4o-mini` · stub when no key"},{"phase":"p7","lane":"api","kind":"api","badge":20,"tag":"LLM provider API","title":"Messages API","body":"`POST api.anthropic.com/v1/messages` (x-api-key) · or `POST api.openai.com/v1/chat/completions`"},{"phase":"p7","lane":"data","kind":"platform","tag":"Flat file","title":"Mentor memory","body":"Last 10 turns per mentor + learner in `mentorMemory.json`"},{"phase":"p7","lane":"guard","kind":"guardrail","tag":"Guardrail","title":"Cost and prompt safety","body":"2M tokens/day global · 50k/user/day · 20 req/min · client can't change the persona"},{"phase":"p8","lane":"ui","kind":"actor","badge":21,"tag":"Learner · Plans","title":"Upgrades","body":"Pro unlocks L4+; paywall off during launch promo (first 200 users or 90 days)"},{"phase":"p8","lane":"svc","kind":"service","badge":22,"tag":"Node server","title":"Checkout and webhooks","body":"`POST /api/v1/billing/checkout` · `POST /api/v1/billing/webhook/stripe` (signature + idempotency ledger) · `/iap/verify` **stub**"},{"phase":"p8","lane":"api","kind":"api","badge":23,"tag":"Stripe SDK","title":"Payments","body":"customers.create · checkout.sessions.create · webhooks.constructEvent · subscriptions.cancel"},{"phase":"p8","lane":"data","kind":"notintegrated","tag":"Not integrated","title":"App Store / Play receipts","body":"Receipt verification is a TODO; `subscriptions.json` + ledger on flat file"},{"phase":"p8","lane":"guard","kind":"guardrail","tag":"Guardrail · gap","title":"Paywall is client-side","body":"Plan read from localStorage; server enforcement planned. Launch cap counts signed-in users only"},{"phase":"p9","lane":"ui","kind":"actor","badge":24,"tag":"Learner / teacher · hidden by default","title":"Community and teaching","body":"Recitals, profiles, assignments, creator portal, proctored exams, live lessons, compositions · song upload (visible)"},{"phase":"p9","lane":"svc","kind":"service","badge":25,"tag":"Node server","title":"Routes behind FEATURES flag","body":"Registered only when enabled · admin-only: pass exam, publish lesson, review composition · owner-only profiles"},{"phase":"p9","lane":"ai","kind":"llm","badge":26,"tag":"LLM call · flag-gated","title":"Composition auto-review","body":"Same provider as the mentor · rubric scores + strengths · `FEATURES=compositions`"},{"phase":"p9","lane":"ai","kind":"optional","tag":"Optional models","title":"Basic Pitch + Demucs","body":"Song upload `POST /transcribe` · `POLYPHONIC_BACKEND`, `STEMS_BACKEND` (off)"},{"phase":"p9","lane":"api","kind":"api","badge":27,"tag":"Integrations","title":"Zoom · Resend · Stripe Connect","body":"`POST zoom.us/oauth/token`, `api.zoom.us/v2/users/{id}/meetings` · `POST api.resend.com/emails` · accounts.create · yt-dlp off (`YT_DLP_ENABLED`)"},{"phase":"p9","lane":"data","kind":"optional","tag":"Optional engines","title":"Postgres · S3/R2 · Sentry · PostHog","body":"`PERSISTENCE_DRIVER=postgres` (12 tables, dual-write) · `STORAGE_DRIVER=s3` · on when keys set"},{"phase":"p9","lane":"guard","kind":"eval","tag":"Eval · CI","title":"Server auth tests","body":"32 tests: spoofed ids, forged tokens, admin/owner checks, hidden routes 404, boot smoke test"}],"footnote":"Grey spine: the service calls every box it touches in that phase. Flag-gated = off by default in code; the flag is named. Optional = behind a config switch. Not integrated = named in the docs but absent from code. Browser storage and flat files are per device / per server and not backed up.","source":"Source of truth: github.com/Phani3108/MusicLuv, main (commit 74d78a3, 29 Oct 2026)","steps":[{"group":"UC1 · Open and pick an instrument","items":[{"n":1,"text":"The learner opens the web app, runs a short mic check (browser echo cancelling, noise suppression and auto-gain are switched off because they distort music), and picks an instrument. Eight hand-authored instruments are shown; 14 generated ones are hidden."},{"n":2,"text":"The app restores the learner's place from browser storage (user, progress, current instrument and lesson) and asks the server for the launch-promo status (`GET /api/v1/monetization/status`)."},{"n":3,"text":"Sign-in is optional. When Supabase is configured the app signs in through Supabase Auth (email, magic link, Google or Apple); otherwise it uses an anonymous device id."}]},{"group":"UC1 · Learn the lesson","items":[{"n":4,"text":"The lesson runner walks the first four of nine phases: what you're learning, the written lesson, demo clips at 50/75/100 % speed, and close-ups of each instrument control."},{"n":5,"text":"Lesson text, exercises (745) and drills are bundled into the app from the shared catalogs. Demo audio is requested from the server (`GET /api/v1/reference-audio/:lessonId`)."},{"n":6,"text":"The server asks the audio engine to synthesize the demo (`POST /render`). It is a computer-generated tone, not a recorded musician — recorded demos are not integrated yet."}]},{"group":"UC1 · Try it on screen","items":[{"n":7,"text":"The learner plays the on-screen instrument to find the lesson's notes. The keyboard range follows the lesson, so left-hand and bass lessons are playable."},{"n":8,"text":"The app counts a hit on the exact note, or on the same note name when the on-screen instrument can't reach that octave; for drums any distinct pads count. Sound comes from Tone.js."},{"n":9,"text":"Piano, guitar and violin samples load from a public GitHub Pages CDN (tonejs-instruments). Self-hosted, licensed samples are planned."}]},{"group":"UC2 · Record a take","items":[{"n":10,"text":"The learner starts the exercise: the mic opens with a live level meter, a one-bar count-in clicks, then they play. The take ends automatically or when they tap Done. Offline mode saves the take on the device instead of grading it."},{"n":11,"text":"Audio is kept only from just before the downbeat, so warm-up notes never reach the grader, and is packed as a WAV file. The live pitch meter runs in the browser and is display-only."}]},{"group":"UC2 · Grade the take","items":[{"n":12,"text":"The app sends the take, the target notes (stretched to the take's tempo), the rubric and the mode (notes, or onsets for claps, drums and tabla) to the audio engine (`POST /grade`, 30-second timeout). A health check drives the live / offline / demo status chip."},{"n":13,"text":"The engine finds the pitch frame by frame (pYIN), splits notes where they are re-struck, lines the take up with the target while allowing for a late start and a different tempo, and scores pitch in cents, rhythm and consistency. Tone and dynamics are reported as not graded."},{"n":14,"text":"No AI model is used by default. The CREPE neural pitch model can replace pYIN with `PITCH_BACKEND=crepe`. Offline takes are graded the same way when the device comes back online."}]},{"group":"UC2 · Feedback and mastery","items":[{"n":15,"text":"The learner sees the score, a plain list of what to fix, their take overlaid on the target, a short corrective drill, and the lesson's mastery quiz."},{"n":16,"text":"The lesson's own pass rules are applied on top of the rubric, then XP, hearts and completed lessons are updated in browser storage. A simulated (demo-mode) grade never changes progress."}]},{"group":"UC3 · Ask the mentor","items":[{"n":17,"text":"The learner asks the mentor a question in the chat panel; the app sends the message with the lesson id and a summary of the last score."},{"n":18,"text":"The server checks the learner is signed in, limits them to 30 messages a minute, builds the mentor's persona and lesson context from its own catalogs (the client can't rewrite it), and caps the message at 2,000 characters."},{"n":19,"text":"Claude writes a 2–5 sentence reply in the mentor's voice with one concrete next step (`claude-sonnet-4-6` by default, 300-token cap). Without an API key a stub answers; if the call fails a canned line is used."},{"n":20,"text":"The call goes to Anthropic's Messages API (or OpenAI's chat API if that provider is configured). The last 10 turns are remembered per mentor and learner on the server."}]},{"group":"UC3 · Upgrade and pay","items":[{"n":21,"text":"Level 4 and above need the Pro plan; during the launch promo (first 200 users or 90 days) everything is unlocked."},{"n":22,"text":"The server starts a Stripe Checkout for the signed-in user and updates the subscription from Stripe's signed webhook, ignoring duplicates. App Store / Play receipt verification is a stub."},{"n":23,"text":"Stripe calls: create customer, create checkout session, verify webhook signature, cancel subscription."}]},{"group":"UC3 · Grow (mostly flag-gated)","items":[{"n":24,"text":"Community recitals, profiles, teacher assignments, the creator portal, proctored exams, live 1:1 lessons and composition review are hidden until the core loop is proven. Song upload is visible."},{"n":25,"text":"Their server routes exist only when switched on with `FEATURES`. Passing an exam, publishing a creator lesson and reviewing a composition are admin-only; profiles and assignments are owner-only."},{"n":26,"text":"When compositions are switched on, uploaded pieces get an automatic first review from the same LLM provider, which a human reviewer can override."},{"n":27,"text":"Integrations used by these features: Zoom (meeting links for exams and lessons), Resend (emails), Stripe Connect (creator payouts). URL import with yt-dlp is off."}]}],"sections":[{"title":"Guardrails","intro":"What protects learners, data and cost today. Gaps are listed as gaps.","table":{"cols":["Guardrail","What it prevents","Where it is enforced","Default / switch"],"rows":[["Verified identity","Impersonating another learner with a made-up user id","`server/src/authMiddleware.ts` — Supabase JWT (HS256) only","On when `SUPABASE_JWT_SECRET` set; production refuses to boot without it"],["Route authorization","Passing your own exam, publishing lessons, editing others' profiles","`server/src/authz.ts` + `httpRoutes.ts` (requireUser / requireSelfOrAdmin / requireAdmin)","Always on; admin = `ADMIN_TOKEN`"],["Hidden features","Unfinished, unsecured features being reachable","`client/src/lib/features.ts`, `server/src/features.ts`","Off; `VITE_FEATURES` / `FEATURES`"],["Honest grading","Fake scores shown as real; fake scores earning progress","`client/src/components/PracticeStudio.tsx`, `mocks/api.ts`","Always on; demo mode only when no engine URL"],["Take-only capture","Warm-up notes and waiting time being graded","`client/src/audio/mic.ts`, `audio/countIn.ts`","Always on"],["Engine input limits","Huge or undecodable uploads, bad lesson data crashing the grader","`audio-engine/main.py` (413 / 415 / 422)","20 MB, 180 s; `AUDIO_ENGINE_MAX_UPLOAD_MB`, `AUDIO_ENGINE_MAX_SECONDS`"],["LLM cost guards","A runaway bill from the mentor","`server/src/llm/costGuards.ts`","2M tokens/day global (`LLM_GLOBAL_TOKENS_PER_DAY`), 50k/user/day, 20 req/min, 2 concurrent per mentor"],["Prompt safety","Callers rewriting the mentor's system prompt","`httpRoutes.ts` mentor route — persona and lesson from server catalogs; 2,000-char cap","Always on"],["Rate limits","Flooding grading or chat","`server/src/rateLimiter.ts`","Grade 60/min per caller, mentor 30/min per user"],["Payment integrity","Forged or replayed Stripe events","`server/src/billingService.ts` — signature check + webhook ledger","On when `STRIPE_WEBHOOK_SECRET` set"],["Launch-cap integrity","Exhausting the free-seat promo with fake ids","`/api/v1/monetization/seen` requires a signed-in user","Always on"],["CORS","Other websites calling the engine or server","`audio-engine/main.py`, `server/src/index.ts`","`AUDIO_ENGINE_CORS_ORIGINS`, `CORS_ORIGINS` (localhost:5173)"],["Secrets","Keys in the browser","LLM, Stripe, Zoom, Resend keys are server-side env only","—"],["Gap: paywall","Free users opening paid levels","Client-side only (localStorage)","Server enforcement planned (Phase 3)"],["Gap: storage","Data loss, no per-user isolation in a database","Flat JSON files on one server; browser storage per device","Supabase + RLS planned (Phase 3)"],["Gap: PII and audio retention","Keeping learner recordings longer than needed","Takes stay in the browser; no retention policy yet","Planned"]]}},{"title":"Evals and quality gates","intro":"What measures whether the product is right, and whether each check is live, partial or planned.","table":{"cols":["Eval","What it measures","When it runs","Threshold","Status"],"rows":[["Grading edge-case suite","Repeated notes, flats, late start, tempo, cents error, vibrato, claps, silence, bad input","CI (`audio-engine/tests`, 74 tests)","All pass","Live"],["Real-audio agreement gate","Engine pass/fail vs a music teacher on real recordings","CI + release (`tests/test_real_corpus.py`, `scripts/eval_corpus.py`)","≥ 90 % agreement, ≤ 5 % false fails","Partial — harness ready, no recordings yet"],["Grading latency","Time to grade a take","Measured manually","< 2 s p95 (roadmap)","Partial — 30 s take ≈ 2.4 s on a laptop"],["Server security tests","Spoofing, forged/expired tokens, admin and owner checks, hidden routes, persona injection, boot check","CI (`server/test`, 32 tests)","All pass","Live"],["Server boot smoke test","The server starts and answers `/api/v1/health`","CI","Up within 30 s","Live"],["Client unit tests","Note maths, keyboard range, grading mode, tempo scaling, pass rules, progress","CI (`client`, 25 tests)","All pass","Live"],["Typecheck + build","Client and server compile; client bundles","CI","No errors","Live"],["Mastery quizzes","Learner understanding per lesson","Runtime (217 exams in catalog)","Per-exam pass threshold","Partial — 4 of 6 question types are placeholders"],["Mentor answer quality","Whether mentor replies are correct and helpful","—","—","Planned — no eval set"],["Composition auto-review quality","LLM review vs human reviewer","—","—","Planned (feature hidden)"],["Lesson definition of done","Every lesson has all 9 phases, audio, quiz, drills (vision §10)","—","—","Planned — no automated check"],["Learner outcomes","Retention, practice minutes, pass rates","PostHog when `POSTHOG_API_KEY` set","—","Partial — events wired, no dashboard"]]}},{"title":"Data and history calls","bullets":["**Read on every visit:** browser localStorage — user, progress, XP, hearts, plan, launch status, current lesson (`client/src/atoms`).","**Written per take:** last grade and completed lessons to localStorage; offline takes (WAV + request) to IndexedDB `musicluv/offlineAttempts`.","**Server flat files** (`MUSICLUV_DATA_DIR`): progress, mentor memory (last 10 turns), subscriptions, Stripe ledgers, launch state, users, quests, community data. One server only; not backed up.","**Optional Postgres dual-write** (`PERSISTENCE_DRIVER=postgres`, 12 tables in `server/src/persistence/migrate.ts`): progress and attempts mirrored; flat file stays the source of truth.","**Not integrated:** server-side grade history (the `/api/v1/grade` proxy is unused by the app), recorded reference audio, cross-device sync, App Store / Play receipts."]},{"title":"LLM calls","table":{"cols":["Prompt / function","Model","When it runs","What it produces","Switch"],"rows":[["`answerAsMentor` (`server/src/llm/mentorService.ts`)","`claude-sonnet-4-6` (alt `gpt-4o-mini`; stub)","Learner sends a mentor message","2–5 sentence reply in persona, one next action, ≤ 300 tokens","`LLM_PROVIDER`, `ANTHROPIC_API_KEY`, `LLM_MODEL`"],["`reviewComposition` (`server/src/llm/compositionReview.ts`)","Same provider","Composition uploaded","Rubric scores, strengths, improvements, suggested status","Flag-gated: `FEATURES=compositions`"]]}},{"title":"Embedding models","table":{"cols":["Model","Used for","Where it runs"],"rows":[["None","No embeddings or vector search in the code","—"]]}},{"title":"Other ML models","table":{"cols":["Model","Used for","Default / switch"],"rows":[["pYIN (librosa)","Pitch tracking for grading — classic signal processing","Default"],["CREPE (TensorFlow)","Neural pitch tracking for grading","Off — `PITCH_BACKEND=crepe`"],["Basic Pitch (Spotify)","Chord/polyphonic transcription for song upload","Off — `POLYPHONIC_BACKEND=basic_pitch`"],["Demucs (Meta)","Separating an instrument from a song","Off — `STEMS_BACKEND=demucs`"]]}},{"title":"API calls and integrations","table":{"cols":["System","Call","Purpose","Auth"],"rows":[["MusicLuv audio engine","`POST /grade`, `POST /render`, `POST /transcribe`, `GET /health`","Grade takes, synthesize demos, song upload","None (CORS-limited)"],["MusicLuv server","`/api/v1/*` (mentor, billing, progress, reference audio, quests, experts, flagged community routes)","Everything that needs a server","Supabase JWT (dev: device id)"],["Anthropic","`POST https://api.anthropic.com/v1/messages`","Mentor replies, composition review","`x-api-key`"],["OpenAI (alternative)","`POST https://api.openai.com/v1/chat/completions`","Same, if configured","Bearer key"],["Supabase Auth","`/auth/v1/token`, `/signup`, `/otp`, `/authorize`, `/recover`, `/logout`","Sign-in","Anon key"],["Stripe","customers, checkout.sessions, webhooks, subscriptions, accounts, accountLinks","Subscriptions, creator payouts","Secret key + webhook secret"],["Zoom","`POST zoom.us/oauth/token`, `POST api.zoom.us/v2/users/{id}/meetings`","Meeting links (flag-gated features)","Server-to-server OAuth"],["Resend","`POST https://api.resend.com/emails`","Welcome, certificate, digest emails","API key"],["PostHog / Sentry","SDKs (`https://us.i.posthog.com`)","Analytics, error tracking","Keys, optional"],["S3 / Cloudflare R2","Signed PUT (SigV4)","Composition uploads","Access keys, `STORAGE_DRIVER=s3`"],["tonejs-instruments CDN, Google Fonts","`GET` from the browser","Instrument samples, fonts","Public"],["Not integrated","Purchase-order-style history, App Store / Play receipt APIs, yt-dlp ingest","—","—"]]}},{"title":"Tech stack","table":{"cols":["Layer","Components and versions"],"rows":[["Web client","React 18, Vite 5, TypeScript 5.5, Jotai 2, Tailwind 3, Tone.js 15, @tonejs/midi"],["Mobile","Capacitor 6 config only (iOS/Android projects not generated)"],["Server","Node 22, Express 4, tsx, multer, stripe 17, pg 8, @sentry/node 8, posthog-node 4"],["Audio engine","Python 3.10–3.12, FastAPI, uvicorn, librosa 0.11, numpy 1.26, scipy, soundfile"],["AI","Anthropic Messages API (raw fetch), optional OpenAI; optional CREPE, Basic Pitch, Demucs"],["Shared","TypeScript catalogs in `shared/catalogs` (lessons, 745 exercises, 217 exams, mentors, rubrics)"],["CI","GitHub Actions: client typecheck/test/build, server typecheck/test/boot, engine pytest"]]}},{"title":"Switches","table":{"cols":["Env flag","Effect","Default"],"rows":[["`VITE_AUDIO_ENGINE_URL`","Real grading; without it the app is in demo mode","unset (demo)"],["`VITE_SERVER_URL`","Mentor chat, launch status","unset"],["`VITE_FEATURES` / `FEATURES`","Show / register hidden features","empty (hidden)"],["`SUPABASE_JWT_SECRET`","Verified identity; required in production","unset (dev device id)"],["`STRICT_AUTH`","Reject all non-public requests without identity","false"],["`LLM_PROVIDER`, `ANTHROPIC_API_KEY`, `LLM_MODEL`","Real mentor LLM","stub"],["`LLM_GLOBAL_TOKENS_PER_DAY`","Daily LLM token cap","2,000,000"],["`PITCH_BACKEND`, `POLYPHONIC_BACKEND`, `STEMS_BACKEND`","Optional ML models","pyin / none / none"],["`PERSISTENCE_DRIVER`, `DATABASE_URL`","Postgres dual-write","flat file"],["`STORAGE_DRIVER`","Upload storage","local"],["`STRIPE_SECRET_KEY`, `STRIPE_WEBHOOK_SECRET`","Payments","unset"],["`YT_DLP_ENABLED`","Import songs from a URL","false"]]}}]}</script>

<script>
(function () {
  const W = JSON.parse(document.getElementById('workflow-data').textContent);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // Inline `code` and **bold** in body text, after escaping.
  const rich = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  if (location.hash === '#diagram' || new URLSearchParams(location.search).has('diagram')) document.body.classList.add('diagram-only');

  document.title = W.title;
  document.getElementById('title').textContent = W.title;
  document.getElementById('subtitle').textContent = W.subtitle || '';
  document.getElementById('meta').innerHTML = (W.meta || []).map(m => `<dt>${esc(m.k)}</dt><dd>${rich(m.v)}</dd>`).join('');

  const KIND_LABEL = {
    actor: 'People and UI', service: 'Service code (deterministic)', llm: 'LLM call', embedding: 'Embedding call',
    api: 'Platform / integration API', platform: 'Platform or data service', optional: 'Optional (config switch)',
    notintegrated: 'Not integrated yet', guardrail: 'Guardrail', eval: 'Eval / quality check',
  };
  const phases = W.phases, lanes = W.lanes;
  const colW = p => p.gap ? '46px' : `${p.width || 236}px`;
  const grid = document.createElement('div');
  grid.className = 'grid';
  grid.style.gridTemplateColumns = `150px ${phases.map(colW).join(' ')}`;

  // Row 1: use-case bands spanning their phases.
  grid.insertAdjacentHTML('beforeend', '<div></div>');
  let col = 2;
  const ucOf = id => (W.useCases || []).find(u => u.phases.includes(id));
  for (let i = 0; i < phases.length;) {
    const uc = ucOf(phases[i].id);
    if (!uc) { grid.insertAdjacentHTML('beforeend', `<div style="grid-column:${col}"></div>`); i++; col++; continue; }
    let span = 0; while (i + span < phases.length && ucOf(phases[i + span].id) === uc) span++;
    grid.insertAdjacentHTML('beforeend', `<div class="uc" style="grid-column:${col} / span ${span}">${esc(uc.id)}&nbsp; ${esc(uc.title)}</div>`);
    i += span; col += span;
  }
  // Row 2: phase headers.
  grid.insertAdjacentHTML('beforeend', '<div></div>');
  phases.forEach(p => grid.insertAdjacentHTML('beforeend', p.gap ? '<div></div>' : `<div class="ph">${esc(p.title)}</div>`));
  // Lane rows.
  lanes.forEach((lane, li) => {
    grid.insertAdjacentHTML('beforeend', `<div class="lanehead"><b>${esc(lane.title)}</b><span>${esc(lane.subtitle || '')}</span></div>`);
    phases.forEach(p => {
      if (p.gap) {
        if (li === 0) grid.insertAdjacentHTML('beforeend', `<div class="gapcol" style="grid-row: span ${lanes.length}"><span>${esc(p.text || '')}</span></div>`);
        return;
      }
      const boxes = (W.boxes || []).filter(b => b.phase === p.id && b.lane === lane.id);
      grid.insertAdjacentHTML('beforeend', `<div class="cell">${boxes.map(b => `
        <div class="box k-${esc(b.kind)}">
          ${b.badge ? `<div class="badge">${esc(b.badge)}</div>` : ''}
          <div class="tag">${esc(b.tag || KIND_LABEL[b.kind] || '')}</div>
          <div class="t">${esc(b.title)}</div>
          <div class="b">${rich(b.body || '')}</div>
        </div>`).join('')}</div>`);
    });
  });
  const used = [...new Set((W.boxes || []).map(b => b.kind))];
  const legend = `<div class="legend"><b style="color:var(--ink)">Legend</b>${used.map(k => `<span><i class="k-${k}"></i>${esc(KIND_LABEL[k] || k)}</span>`).join('')}<span><i class="n"></i>Step in the walkthrough</span></div>`;
  const foot = `<div class="foot"><span>${rich(W.footnote || '')}</span><span>${rich(W.source || '')}</span></div>`;
  const d = document.getElementById('diagram');
  d.appendChild(grid);
  d.insertAdjacentHTML('beforeend', legend + foot);

  // Readout text: step walkthrough, then tables / bullet sections.
  const t = [];
  if (W.steps) {
    t.push(`<h2>The flow, step by step</h2><p class="intro">Numbers match the badges in the diagram.</p>`);
    W.steps.forEach(g => {
      t.push(`<h3>${esc(g.group)}</h3><ol class="steps">${g.items.map(s => `<li><span class="num">${esc(s.n ?? '·')}</span><span>${rich(s.text)}</span></li>`).join('')}</ol>`);
    });
  }
  (W.sections || []).forEach(s => {
    t.push(`<h2>${esc(s.title)}</h2>`);
    if (s.intro) t.push(`<p class="intro">${rich(s.intro)}</p>`);
    if (s.table) t.push(`<table><thead><tr>${s.table.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${s.table.rows.map(r => `<tr>${r.map(c => `<td>${rich(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
    if (s.bullets) t.push(`<ul class="bul">${s.bullets.map(b => `<li>${rich(b)}</li>`).join('')}</ul>`);
  });
  document.getElementById('text').innerHTML = t.join('');
})();
</script>
